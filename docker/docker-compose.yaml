version: '3.9'
services:
  postgres:
    container_name: blog_db
    image: postgres:latest
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'postgres'
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "35432"
    ports:
      - "35432:5432"
    networks:
      - blog_network
    restart: always

networks:
  blog_network:
    driver: bridge
volumes:
  blog_volume:
    driver: local